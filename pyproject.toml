[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyconfig"
version = "0.2.2"
description = "Simple, layered configuration management for Python applications."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]
license = "MIT"
authors = [{name = "EasyConfig contributors"}]
keywords = ["configuration", "config", "settings", "json", "toml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["build>=1.2", "twine>=5"]

[project.scripts]
easyconfig-docs = "easyconfig.docs:_install_docs_to_site_packages"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
easyconfig = ["../README.md", "../Syntax.md", "../Quickstart.md"]

[tool.setuptools.packages.find]
include = ["easyconfig*"]
