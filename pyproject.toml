[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyconfig"
version = "0.1.0"
description = "Simple, layered configuration management for Python applications."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]
license = {text = "MIT"}
authors = [{name = "EasyConfig contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools.packages.find]
include = ["easyconfig*"]
