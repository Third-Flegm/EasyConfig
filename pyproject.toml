[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "FlegmCNF"
version = "0.2.1"
description = "Simple, layered configuration management for Python applications."
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]
license = "MIT"
authors = [{name = "ThatFlegm"}]
keywords = ["configuration", "config", "settings", "json", "toml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["build>=1.2", "twine>=5"]

[project.scripts]
flegmcnf = "flegmcnf.docs:_install_docs_to_site_packages"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
flegmcnf = ["config.json"]

[tool.setuptools.data-files]
"flegmcnf-docs" = ["docs/README.md", "docs/Syntax.md", "docs/Quickstart.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flegmcnf*"]
